<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me | Homepage</title>
    <style>
        /* Base Styles for Dark Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Primary Color: Black */
            color: #ffffff;            /* Text Color: White */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header & Navigation */
        header {
            padding: 2rem;
            text-align: center;
        }

        nav {
            margin-top: 1.5rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        /* Subtle hover effect to keep the clean look */
        .nav-links a:hover {
            border-color: #ffffff;
            background-color: #ffffff;
            color: #000000;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.2rem;
            color: #a0a0a0; /* Slightly dimmed white for subtext readability */
            max-width: 600px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            color: #666666;
            border-top: 1px solid #222222;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="gaming.html">Gaming</a></li>
                <li><a href="drawing.html">Drawing</a></li>
                <li><a href="music.html">Music</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Hello, I'm [Your Name]</h1>
            <p>Welcome to my personal space. Explore the links above to learn more about my favorite games, my artwork, and the music I listen to.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 [Your Name]. All rights reserved.</p>
    </footer>

</body>
</html>
